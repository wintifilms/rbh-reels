name: Radio Begov Han Reels Generator

on:
  repository_dispatch:
    types: [create_reel]
  workflow_dispatch:
    inputs:
      artwork_url:
        description: 'URL slike pjesme'
        required: true
      caption:
        description: 'Opis za Reels'
        required: true

jobs:
  build_and_publish_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje repozitorija
        uses: actions/checkout@v4

      - name: Instalacija FFmpeg-a, ImageMagick-a i fontova
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick curl jq fonts-roboto librsvg2-bin

      - name: Priprema grafike i rotacija džinglova
        env:
          ARTWORK_URL: ${{ github.event.client_payload.artwork_url || github.event.inputs.artwork_url }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Preuzimanje omota pjesme u punom kvalitetu
          curl -L -s "$ARTWORK_URL" -o cover_raw.jpg
          if [ ! -s cover_raw.jpg ]; then
            curl -L -s "https://radiobegovhan.com/assets/radiobegovhan_cover.png" -o cover_raw.jpg
          fi

          # 2. Sekvencijalna rotacija džinglova (svaki novi Reels uzima sljedeći .mp3 po redu)
          mapfile -t JINGLES < <(find . -maxdepth 2 -iname "*.mp3" | sort)
          NUM_JINGLES=${#JINGLES[@]}
          if [ "$NUM_JINGLES" -gt 0 ]; then
            INDEX=$(( (RUN_NUM - 1) % NUM_JINGLES ))
            JINGLE_FILE="${JINGLES[$INDEX]}"
            echo "Odabrani džingl ($((INDEX + 1))/$NUM_JINGLES): $JINGLE_FILE"
            ffmpeg -y -i "$JINGLE_FILE" -t 25 -af "afade=t=in:st=0:d=0.4,afade=t=out:st=24.2:d=0.8" -acodec aac -b:a 192k -ar 44100 -ac 2 audio.m4a
          else
            echo "Nema pronađenih MP3 džinglova, kreiram tihi audio zapis."
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 25 -acodec aac -b:a 192k audio.m4a
          fi

          # 3. Kristalno oštar HD omot pjesme (880x880) sa tankim poluprovidnim bijelim rubom
          convert cover_raw.jpg -filter Lanczos -resize 880x880^ -gravity center -extent 880x880 \
            -bordercolor "rgba(255,255,255,0.22)" -border 2 cover_styled.png

          # 4. Moderan, poluprovidan bijeli SVG potpis (potpuno čista prozirna podloga)
          cat << 'EOF' > brand_text.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170">
            <g text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif">
              <text x="480" y="65" font-weight="900" font-size="38" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="12">RADIO BEGOV HAN</text>
              <rect x="390" y="92" width="180" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.40"/>
              <text x="480" y="136" font-weight="500" font-size="24" fill="#FFFFFF" fill-opacity="0.78" letter-spacing="5">www.radiobegovhan.com</text>
            </g>
          </svg>
          EOF
          rsvg-convert -w 960 -h 170 brand_text.svg -o brand_text.png

      - name: Renderovanje 1080x1920 Full HD Reels videa
        run: |
          ffmpeg -y \
            -f lavfi -i color=c=0x000000:s=1080x1920:r=30 \
            -loop 1 -i cover_styled.png \
            -loop 1 -i brand_text.png \
            -i audio.m4a \
            -filter_complex "\
              [3:a]aformat=channel_layouts=mono,showwaves=s=880x110:mode=cline:rate=30:colors=0xffffff@0.85,format=rgba[waves]; \
              [0:v][1:v]overlay=(W-w)/2:260:format=auto[tmp1]; \
              [tmp1][waves]overlay=(W-w)/2:1215:format=auto[tmp2]; \
              [tmp2][2:v]overlay=(W-w)/2:1375:format=auto,format=yuv420p[v]" \
            -map "[v]" -map 3:a \
            -c:v libx264 -profile:v high -level:v 4.2 -preset slow -crf 16 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k \
            -shortest -movflags +faststart reel.mp4

      - name: Objava direktno na Facebook Reels
        env:
          PAGE_ID: '1049692904892567'
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ github.event.client_payload.caption || github.event.inputs.caption }}
        run: |
          if [ -z "$PAGE_TOKEN" ]; then
            echo "GREŠKA: FB_PAGE_TOKEN secret nije podešen!"
            exit 1
          fi

          INIT_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
            -H "Content-Type: application/json" \
            -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}")
          
          VIDEO_ID=$(echo "$INIT_RES" | jq -r '.video_id // empty')
          UPLOAD_URL=$(echo "$INIT_RES" | jq -r '.upload_url // empty')

          if [ -z "$VIDEO_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Greška pri inicijalizaciji Reelsa na Facebooku: $INIT_RES"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s reel.mp4)
          curl -s -X POST "$UPLOAD_URL" \
            -H "Authorization: OAuth ${PAGE_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            --data-binary "@reel.mp4"

          FINISH_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
            --data-urlencode "access_token=${PAGE_TOKEN}" \
            --data-urlencode "video_id=${VIDEO_ID}" \
            --data-urlencode "upload_phase=finish" \
            --data-urlencode "video_state=PUBLISHED" \
            --data-urlencode "description=${CAPTION}")
          
          echo "Reels status: $FINISH_RES"
