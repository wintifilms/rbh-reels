name: Radio Begov Han Reels Generator

on:
  repository_dispatch:
    types: [create_reel]
  workflow_dispatch:
    inputs:
      artwork_url:
        description: 'URL slike pjesme'
        required: true
      caption:
        description: 'Opis za Reels'
        required: true

jobs:
  build_and_publish_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje repozitorija
        uses: actions/checkout@v4

      - name: Instalacija FFmpeg-a, ImageMagick-a i Roboto fontova
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick curl jq fonts-roboto

      - name: Priprema slike i profesionalne grafike
        env:
          ARTWORK_URL: ${{ github.event.client_payload.artwork_url || github.event.inputs.artwork_url }}
        run: |
          # 1. Preuzimanje slike pjesme uz fallback na default sliku ako ne postoji
          curl -L -s "$ARTWORK_URL" -o cover_raw.jpg
          if [ ! -s cover_raw.jpg ]; then
            curl -L -s "https://radiobegovhan.com/assets/radiobegovhan_cover.png" -o cover_raw.jpg
          fi

          # 2. Priprema audio zapisa (džingl ili tišina)
          JINGLE_FILE=$(find . -maxdepth 1 -iname "*.mp3" | shuf -n 1)
          if [ -z "$JINGLE_FILE" ]; then
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 25 -acodec aac -b:a 192k audio.m4a
          else
            ffmpeg -y -i "$JINGLE_FILE" -t 25 -acodec aac -b:a 192k -ar 44100 -ac 2 audio.m4a
          fi

          # 3. Omot pjesme - oštar, visoka rezolucija sa elegantnim bijelim okvirom (bez bagovite crne sjene)
          convert cover_raw.jpg -resize 800x800^ -gravity center -extent 800x800 \
            -bordercolor "#FFFFFF" -border 4 cover_styled.png

          # 4. Gornji minimalistički UŽIVO bedž (Glassmorphism stil)
          convert -size 480x64 xc:none \
            -fill "rgba(0, 0, 0, 0.60)" -draw "roundrectangle 0,0 480,64 20,20" \
            -fill "#FF2A4B" -draw "circle 35,32 35,42" \
            -font "Roboto-Bold" -pointsize 22 -fill white \
            -gravity center -annotate +12+0 "RADIO BEGOV HAN  •  UŽIVO" \
            live_badge.png

          # 5. Donja brendirana kartica (Pro TV dizajn)
          convert -size 720x100 xc:none \
            -fill "rgba(0, 0, 0, 0.65)" -draw "roundrectangle 0,0 720,100 22,22" \
            -font "Roboto-Bold" -pointsize 26 -fill white -gravity center -annotate +0+-14 "SLUŠAJTE UŽIVO 24/7" \
            -font "Roboto-Medium" -pointsize 20 -fill "#F5B041" -gravity center -annotate +0+20 "www.radiobegovhan.com" \
            brand_card.png

      - name: Renderovanje 1080x1920 Full HD Reels videa
        run: |
          ffmpeg -y \
            -loop 1 -i cover_raw.jpg \
            -loop 1 -i cover_styled.png \
            -loop 1 -i live_badge.png \
            -loop 1 -i brand_card.png \
            -i audio.m4a \
            -filter_complex "\
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=40:15,eq=brightness=-0.30:saturation=1.20[bg]; \
              [bg][2:v]overlay=(W-w)/2:220[tmp1]; \
              [tmp1][1:v]overlay=(W-w)/2:360[tmp2]; \
              [4:a]showwaves=s=780x100:mode=p2p:colors=0xf5b041@0.90|0xffffff@0.80:rate=30:scale=sqrt[waves]; \
              [tmp2][waves]overlay=(W-w)/2:1210[tmp3]; \
              [tmp3][3:v]overlay=(W-w)/2:1350,format=yuv420p[v]" \
            -map "[v]" -map 4:a \
            -c:v libx264 -preset fast -crf 19 -r 30 \
            -c:a aac -b:a 192k \
            -shortest -movflags +faststart reel.mp4

      - name: Objava direktno na Facebook Reels
        env:
          PAGE_ID: '1049692904892567'
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ github.event.client_payload.caption || github.event.inputs.caption }}
        run: |
          if [ -z "$PAGE_TOKEN" ]; then
            echo "GREŠKA: FB_PAGE_TOKEN secret nije podešen!"
            exit 1
          fi

          INIT_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
            -H "Content-Type: application/json" \
            -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}")
          
          VIDEO_ID=$(echo "$INIT_RES" | jq -r '.video_id // empty')
          UPLOAD_URL=$(echo "$INIT_RES" | jq -r '.upload_url // empty')

          if [ -z "$VIDEO_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Greška pri inicijalizaciji Reelsa na Facebooku."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s reel.mp4)
          curl -s -X POST "$UPLOAD_URL" \
            -H "Authorization: OAuth ${PAGE_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            --data-binary "@reel.mp4"

          FINISH_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
            --data-urlencode "access_token=${PAGE_TOKEN}" \
            --data-urlencode "video_id=${VIDEO_ID}" \
            --data-urlencode "upload_phase=finish" \
            --data-urlencode "video_state=PUBLISHED" \
            --data-urlencode "description=${CAPTION}")
          
          echo "Reels status: $FINISH_RES"
