name: Radio Begov Han Reels Generator

on:
  repository_dispatch:
    types: [create_reel]
  workflow_dispatch:
    inputs:
      artwork_url:
        description: 'URL slike pjesme'
        required: true
      caption:
        description: 'Opis za Reels'
        required: true
      artist:
        description: 'Izvodjac'
        required: false
      song:
        description: 'Naziv pjesme'
        required: false
      collaborator_id:
        description: 'FB Page ID izvodjaca za Collaborator tag'
        required: false
      audio_stream_url:
        description: 'Audio Stream URL'
        required: false

jobs:
  build_and_publish_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje repozitorija
        uses: actions/checkout@v4

      - name: Instalacija alata, yt-dlp i Montserrat fonta
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick curl jq librsvg2-bin fontconfig python3-pip python3-requests
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          mkdir -p ~/.local/share/fonts
          curl -L -s "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf" -o ~/.local/share/fonts/Montserrat-ExtraBold.ttf
          curl -L -s "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Medium.ttf" -o ~/.local/share/fonts/Montserrat-Medium.ttf
          fc-cache -f -v

      - name: Preuzimanje VERIFIKOVANOG HD spota, detekcija refrena i priprema teksta
        env:
          ARTWORK_URL: ${{ github.event.client_payload.artwork_url || github.event.inputs.artwork_url }}
          ARTIST_RAW: ${{ github.event.client_payload.artist || github.event.inputs.artist || 'RADIO BEGOV HAN' }}
          SONG_RAW: ${{ github.event.client_payload.song || github.event.inputs.song || 'Tvoj ritam, tvoja muzika' }}
          STREAM_URL: ${{ github.event.client_payload.audio_stream_url || github.event.inputs.audio_stream_url || 'https://live.streamafrica.net/radiobegovhan' }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Priprema čistog teksta (Samo Izvođač i Naziv pjesme, bez ikakvih pozadina)
          clean_xml() {
            echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&#39;/g'
          }
          ARTIST_UPPER=$(echo "$ARTIST_RAW" | tr '[:lower:]' '[:upper:]' | cut -c 1-30)
          SONG_TITLE=$(echo "$SONG_RAW" | cut -c 1-42)

          ARTIST_SAFE=$(clean_xml "$ARTIST_UPPER")
          SONG_SAFE=$(clean_xml "$SONG_TITLE")

          cat << EOF > overlay.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
            <defs>
              <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
              </filter>
            </defs>
            <g text-anchor="middle" font-family="Montserrat, sans-serif" filter="url(#cleanShadow)">
              <text x="540" y="1420" font-weight="800" font-size="42" fill="#FFFFFF" letter-spacing="3">${ARTIST_SAFE}</text>
              <text x="540" y="1480" font-weight="500" font-size="30" fill="#FFFFFF" letter-spacing="1.5">${SONG_SAFE}</text>
            </g>
          </svg>
          EOF

          rsvg-convert -w 1080 -h 1920 overlay.svg -o overlay.png

          # 2. Hirurški precizan Video Finder sa STROGOM VERIFIKACIJOM IZVOĐAČA I PJESME
          VIDEO_READY=0
          if [[ "$ARTIST_RAW" != "RADIO BEGOV HAN" ]] && [[ "$ARTIST_RAW" != "Radio Begov Han" ]]; then
            cat << 'PYEOF' > fetch_video.py
          import subprocess, json, os, sys, re, urllib.parse, requests

          artist_raw = os.environ.get("ARTIST_RAW", "").strip()
          song_raw = os.environ.get("SONG_RAW", "").strip()

          def normalize(text):
              if not text: return ""
              t = text.lower()
              rep = {'č':'c','ć':'c','ž':'z','š':'s','đ':'dj'}
              for k, v in rep.items():
                  t = t.replace(k, v)
              t = re.sub(r'\(.*?\)|\[.*?\]', ' ', t)
              t = re.sub(r'[^a-z0-9\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          # Izvlačimo glavne ključne riječi izvođača i pjesme koje MORAJU postojati u naslovu spota
          main_artist = re.split(r',|feat\.|ft\.|&| x | i |\/', artist_raw, flags=re.IGNORECASE)[0].strip()
          norm_artist = normalize(main_artist)
          norm_song = normalize(song_raw)

          artist_tokens = [w for w in norm_artist.split() if len(w) >= 3 and w not in ['band', 'bend', 'grupa', 'official']]
          if not artist_tokens and norm_artist:
              artist_tokens = [norm_artist.split()[0]]

          song_tokens = [w for w in norm_song.split() if len(w) >= 3]
          if not song_tokens and norm_song:
              song_tokens = [norm_song.split()[0]]

          # Zabranjene riječi (TV prilozi, vijesti, pijace, karaoke, reakcije, coveri)
          BANNED_WORDS = ['vijesti', 'vesti', 'dnevnik', 'pijaca', 'buvljak', 'polovna roba pijaca', 'prilog', 'emisija', 'karaoke', 'instrumental', 'reaction', 'tutorial', 'parodija', 'uzivo iz']

          def is_verified_music_video(cand_title, cand_channel=""):
              combined = normalize(f"{cand_title} {cand_channel}")
              for bw in BANNED_WORDS:
                  if bw in combined and bw not in norm_song:
                      return False
              # MORA sadržavati ključnu riječ izvođača I ključnu riječ pjesme!
              has_artist = any(t in combined for t in artist_tokens)
              has_song = all(t in combined for t in song_tokens[:2]) if len(song_tokens) >= 2 else any(t in combined for t in song_tokens)
              return has_artist and has_song

          search_term = f"{main_artist} {song_raw}".strip()
          print(f"Verifikovana pretraga spota za: '{main_artist}' - '{song_raw}'")

          # IZVOR 1: Apple Music / iTunes Music Video API (Uz strogu provjeru imena izvođača i pjesme!)
          try:
              itunes_url = f"https://itunes.apple.com/search?term={urllib.parse.quote(search_term)}&entity=musicVideo&limit=5"
              r = requests.get(itunes_url, timeout=12).json()
              for item in r.get("results", []):
                  it_artist = item.get("artistName", "")
                  it_track = item.get("trackName", "")
                  preview_video = item.get("previewUrl", "")
                  if preview_video and is_verified_music_video(it_track, it_artist):
                      print(f"[Apple Music VERIFIED] Pronadjen tacan spot: {it_artist} - {it_track}")
                      vid_data = requests.get(preview_video, timeout=30).content
                      if len(vid_data) > 500000:
                          with open("full_mv.mp4", "wb") as f:
                              f.write(vid_data)
                          with open("start_time.txt", "w") as f:
                              f.write("0")
                          sys.exit(0)
          except Exception as e:
              print("Apple Music info:", e)

          # IZVOR 2: YouTube multi-client pretraga (tv_embedded, ios, android_vr) sa strogom verifikacijom naslova
          yt_clients = ["tv_embedded", "ios", "android_vr", "web_creator"]
          for client in yt_clients:
              try:
                  yt_query = f"ytsearch5:{main_artist} {song_raw} official video"
                  cmd = [
                      "yt-dlp",
                      "--extractor-args", f"youtube:player_client={client}",
                      "--dump-json", "--no-playlist", "--geo-bypass",
                      yt_query
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  lines = [l for l in res.stdout.strip().split('\n') if l.strip()]

                  chosen = None
                  for line in lines:
                      data = json.loads(line)
                      dur = data.get("duration", 0) or 0
                      title = data.get("title", "")
                      uploader = data.get("uploader", "") or data.get("channel", "")
                      if 75 <= dur <= 480 and is_verified_music_video(title, uploader):
                          chosen = data
                          break

                  if chosen:
                      vid_url = chosen.get("webpage_url") or f"https://www.youtube.com/watch?v={chosen['id']}"
                      duration = float(chosen.get("duration", 180))
                      heatmap = chosen.get("heatmap")
                      start_time = min(max(duration * 0.28, 35), max(duration - 35, 0))
                      if heatmap and isinstance(heatmap, list):
                          valid_pts = [p for p in heatmap if 20 <= p.get("start_time", 0) <= (duration - 35)]
                          if valid_pts:
                              best_pt = max(valid_pts, key=lambda x: x.get("value", 0))
                              start_time = max(0, best_pt.get("start_time", 45) - 2)

                      print(f"[YouTube VERIFIED - {client}] Preuzimam tacan spot: {chosen.get('title')} (od {start_time}s)")
                      dl_cmd = [
                          "yt-dlp",
                          "--extractor-args", f"youtube:player_client={client}",
                          "--no-playlist", "--geo-bypass",
                          "--download-sections", f"*{int(start_time)}-{int(start_time)+27}",
                          "-f", "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]/best",
                          "--merge-output-format", "mp4",
                          "-o", "full_mv.mp4",
                          vid_url
                      ]
                      subprocess.run(dl_cmd, check=True, timeout=75)
                      if os.path.exists("full_mv.mp4") and os.path.getsize("full_mv.mp4") > 250000:
                          with open("start_time.txt", "w") as f:
                              f.write("0")
                          sys.exit(0)
              except Exception as e:
                  print(f"YouTube ({client}) info:", e)

          # IZVOR 3: Piped API YouTube Proxy mreža (Zaobilazi sve YouTube blokade na GitHubu i skida originalni YT spot)
          piped_instances = [
              "https://pipedapi.kavin.rocks",
              "https://pipedapi.tokhmi.xyz",
              "https://pipedapi.syncpundit.io",
              "https://api.piped.projectsegfau.lt"
          ]
          for instance in piped_instances:
              try:
                  s_url = f"{instance}/search?q={urllib.parse.quote(search_term + ' official video')}&filter=videos"
                  r = requests.get(s_url, timeout=10)
                  if r.status_code != 200:
                      continue
                  items = r.json().get("items", [])
                  for it in items[:5]:
                      title = it.get("title", "")
                      uploader = it.get("uploaderName", "")
                      dur = it.get("duration", 0) or 0
                      vid_id = it.get("url", "").replace("/watch?v=", "").strip()
                      if 75 <= dur <= 480 and vid_id and is_verified_music_video(title, uploader):
                          st_url = f"{instance}/streams/{vid_id}"
                          st_res = requests.get(st_url, timeout=12).json()
                          hls_url = st_res.get("hls")
                          if hls_url:
                              start_time = min(max(dur * 0.28, 35), max(dur - 35, 0))
                              print(f"[Piped YT Proxy VERIFIED] Preuzimam spot: {title}")
                              ff_cmd = [
                                  "ffmpeg", "-y", "-ss", str(round(start_time, 2)),
                                  "-i", hls_url, "-t", "26",
                                  "-c:v", "libx264", "-preset", "fast", "-crf", "18",
                                  "-c:a", "aac", "-b:a", "320k",
                                  "full_mv.mp4"
                              ]
                              subprocess.run(ff_cmd, check=True, timeout=60)
                              if os.path.exists("full_mv.mp4") and os.path.getsize("full_mv.mp4") > 250000:
                                  with open("start_time.txt", "w") as f:
                                      f.write("0")
                                  sys.exit(0)
              except Exception as e:
                  print(f"Piped ({instance}) info:", e)

          # IZVOR 4: Dailymotion Official API (SAMO kategorija 'music' + STROGA VERIFIKACIJA IMENA IZVOĐAČA I PJESME!)
          try:
              dm_api = f"https://api.dailymotion.com/videos?search={urllib.parse.quote(search_term)}&channel=music&fields=id,title,owner.screenname,duration,url&limit=6"
              dm_res = requests.get(dm_api, timeout=15).json()
              for item in dm_res.get("list", []):
                  dur = float(item.get("duration", 0))
                  dm_title = item.get("title", "")
                  dm_owner = item.get("owner.screenname", "")
                  # Stroga provjera: naslov na Dailymotionu MORA sadržavati i ime pjevača i naziv pjesme!
                  if 75 <= dur <= 480 and is_verified_music_video(dm_title, dm_owner):
                      dm_url = item.get("url")
                      start_time = min(max(dur * 0.28, 35), max(dur - 35, 0))
                      print(f"[Dailymotion Music VERIFIED] Preuzimam tacan spot: {dm_title}")
                      dl_cmd = [
                          "yt-dlp", "--no-playlist", "--geo-bypass",
                          "-f", "best[height<=1080]/best",
                          "-o", "full_mv.mp4",
                          dm_url
                      ]
                      subprocess.run(dl_cmd, check=True, timeout=90)
                      if os.path.exists("full_mv.mp4") and os.path.getsize("full_mv.mp4") > 300000:
                          with open("start_time.txt", "w") as f:
                              f.write(str(round(start_time, 2)))
                          sys.exit(0)
          except Exception as e:
              print("Dailymotion info:", e)

          print("Nije pronadjen verifikovan video spot za ovu pjesmu.")
          sys.exit(1)
          PYEOF

            if python3 fetch_video.py; then
              START_SEC=$(cat start_time.txt)
              echo "Verifikovan spot preuzet! Izrezujem 25 sekundi refrena (od ${START_SEC}s)..."
              ffmpeg -y -ss "$START_SEC" -i full_mv.mp4 -t 25 \
                -vf "fps=30" \
                -af "afade=t=in:st=0:d=0.4,afade=t=out:st=24.2:d=0.8" \
                -c:v libx264 -preset fast -crf 17 \
                -c:a aac -b:a 320k -ar 44100 -ac 2 \
                clip_mv.mp4 && VIDEO_READY=1 || VIDEO_READY=0
            fi
          fi

          # 3. Renderovanje: Ako postoji VERIFIKOVAN HD video spot -> Full Screen 1080x1920 bez rezanja sa strana!
          if [ "$VIDEO_READY" -eq 1 ] && [ -s clip_mv.mp4 ]; then
            echo "USPJEH! Renderujem PRO Full-Screen Video Reels (1080x1920, kompletan spot vidljiv bez rezanja)..."
            ffmpeg -y \
              -i clip_mv.mp4 \
              -loop 1 -r 30 -i overlay.png \
              -filter_complex "\
                [0:v]split=2[v_bg_in][v_fg_in]; \
                [v_bg_in]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=45[v_bg]; \
                [v_fg_in]scale=1080:1350:force_original_aspect_ratio=decrease[v_fg]; \
                [v_bg][v_fg]overlay=(W-w)/2:(H-h)/2-80:format=auto[v_merged]; \
                [v_merged][1:v]overlay=0:0:shortest=1:format=auto,format=yuv420p[v]" \
              -map "[v]" -map 0:a \
              -c:v libx264 -profile:v high -level:v 4.2 -preset medium -crf 16 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 320k -ar 44100 -ac 2 \
              -shortest -movflags +faststart reel.mp4
          else
            echo "Za ovu pjesmu ne postoji verifikovan spot. Aktiviram PRO mod sa HD omotom i 320kbps refrenom..."
            DEFAULT_COVER="https://radiobegovhan.com/assets/radiobegovhan_cover.png"
            FINAL_ARTWORK="$ARTWORK_URL"
            if [ -z "$FINAL_ARTWORK" ] || [[ "$FINAL_ARTWORK" == *"radiobegovhan_cover.png"* ]]; then
              FINAL_ARTWORK="$DEFAULT_COVER"
            fi

            ENCODED_URL=$(jq -rn --arg x "$FINAL_ARTWORK" '$x|@uri')
            ENCODED_FALLBACK=$(jq -rn --arg x "$DEFAULT_COVER" '$x|@uri')

            curl -L -s "https://wsrv.nl/?url=${ENCODED_URL}&w=1080&h=1080&fit=contain&bg=00000000&output=png" -o cover_full.png
            if [ ! -s cover_full.png ]; then
              curl -L -s "https://wsrv.nl/?url=${ENCODED_FALLBACK}&w=1080&h=1080&fit=contain&bg=00000000&output=png" -o cover_full.png
            fi

            curl -L -s "https://wsrv.nl/?url=${ENCODED_URL}&w=1080&h=1920&fit=cover&output=png" -o bg_raw.png
            if [ ! -s bg_raw.png ]; then
              curl -L -s "https://wsrv.nl/?url=${ENCODED_FALLBACK}&w=1080&h=1920&fit=cover&output=png" -o bg_raw.png
            fi

            SEARCH_QUERY="${ARTIST_RAW} ${SONG_RAW}"
            ENCODED_QUERY=$(jq -rn --arg x "$SEARCH_QUERY" '$x|@uri')
            PREVIEW_URL=""

            if [[ "$ARTIST_RAW" != "RADIO BEGOV HAN" ]] && [[ "$ARTIST_RAW" != "Radio Begov Han" ]]; then
              ITUNES_RES=$(curl -s "https://itunes.apple.com/search?term=${ENCODED_QUERY}&media=music&entity=song&limit=1")
              PREVIEW_URL=$(echo "$ITUNES_RES" | jq -r '.results[0].previewUrl // empty')
              if [ -z "$PREVIEW_URL" ]; then
                DEEZER_RES=$(curl -s "https://api.deezer.com/search?q=${ENCODED_QUERY}&limit=1")
                PREVIEW_URL=$(echo "$DEEZER_RES" | jq -r '.data[0].preview // empty')
              fi
            fi

            if [ -n "$PREVIEW_URL" ]; then
              curl -L -s "$PREVIEW_URL" -o preview_raw.tmp
              if [ -s preview_raw.tmp ]; then
                ffmpeg -y -i preview_raw.tmp -t 25 -af "afade=t=in:st=0:d=0.4,afade=t=out:st=24.2:d=0.8" -acodec aac -b:a 320k -ar 44100 -ac 2 audio.m4a || true
              fi
            fi

            if [ ! -s audio.m4a ]; then
              ffmpeg -y -i "$STREAM_URL" -t 25 -af "afade=t=in:st=0:d=0.4,afade=t=out:st=24.2:d=0.8" -acodec aac -b:a 320k -ar 44100 -ac 2 audio.m4a || true
            fi

            if [ ! -s audio.m4a ]; then
              mapfile -t JINGLES < <(find . -maxdepth 2 -iname "*.mp3" | sort)
              NUM_JINGLES=${#JINGLES[@]}
              if [ "$NUM_JINGLES" -gt 0 ]; then
                INDEX=$(( (RUN_NUM - 1) % NUM_JINGLES ))
                ffmpeg -y -i "${JINGLES[$INDEX]}" -t 25 -af "afade=t=in:st=0:d=0.3,afade=t=out:st=24.2:d=0.8" -acodec aac -b:a 320k -ar 44100 -ac 2 audio.m4a
              else
                ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 25 -acodec aac -b:a 320k audio.m4a
              fi
            fi

            ffmpeg -y \
              -loop 1 -r 30 -i bg_raw.png \
              -loop 1 -r 30 -i cover_full.png \
              -loop 1 -r 30 -i overlay.png \
              -i audio.m4a \
              -filter_complex "\
                [0:v]gblur=sigma=50[bg]; \
                [bg][1:v]overlay=(W-w)/2:220:format=auto[tmp1]; \
                [tmp1][2:v]overlay=0:0:format=auto,format=yuv420p[v]" \
              -map "[v]" -map 3:a \
              -c:v libx264 -profile:v high -level:v 4.2 -preset medium -crf 16 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 320k -ar 44100 -ac 2 \
              -shortest -movflags +faststart reel.mp4
          fi

      - name: Objava direktno na Facebook Reels (sa Collaborator Tagom)
        env:
          PAGE_ID: '1049692904892567'
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ github.event.client_payload.caption || github.event.inputs.caption }}
          COLLABORATOR_ID: ${{ github.event.client_payload.collaborator_id || github.event.inputs.collaborator_id || '' }}
        run: |
          if [ -z "$PAGE_TOKEN" ]; then
            echo "GREŠKA: FB_PAGE_TOKEN secret nije podešen!"
            exit 1
          fi

          INIT_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
            -H "Content-Type: application/json" \
            -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}")
          
          VIDEO_ID=$(echo "$INIT_RES" | jq -r '.video_id // empty')
          UPLOAD_URL=$(echo "$INIT_RES" | jq -r '.upload_url // empty')

          if [ -z "$VIDEO_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Greška pri inicijalizaciji Reelsa na Facebooku: $INIT_RES"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s reel.mp4)
          curl -s -X POST "$UPLOAD_URL" \
            -H "Authorization: OAuth ${PAGE_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            --data-binary "@reel.mp4"

          if [ -n "$COLLABORATOR_ID" ]; then
            echo "Šaljem Reels sa Collaborator tagom za Page ID: $COLLABORATOR_ID"
            FINISH_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
              --data-urlencode "access_token=${PAGE_TOKEN}" \
              --data-urlencode "video_id=${VIDEO_ID}" \
              --data-urlencode "upload_phase=finish" \
              --data-urlencode "video_state=PUBLISHED" \
              --data-urlencode "description=${CAPTION}" \
              --data-urlencode "collaborators=[\"${COLLABORATOR_ID}\"]")

            HAS_ERROR=$(echo "$FINISH_RES" | jq -r '.error.message // empty')
            if [ -n "$HAS_ERROR" ]; then
              echo "Izvođač ima zaključane kolaboracije, objavljujem standardno..."
              FINISH_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
                --data-urlencode "access_token=${PAGE_TOKEN}" \
                --data-urlencode "video_id=${VIDEO_ID}" \
                --data-urlencode "upload_phase=finish" \
                --data-urlencode "video_state=PUBLISHED" \
                --data-urlencode "description=${CAPTION}")
            fi
          else
            FINISH_RES=$(curl -s -X POST "https://graph.facebook.com/v22.0/${PAGE_ID}/video_reels" \
              --data-urlencode "access_token=${PAGE_TOKEN}" \
              --data-urlencode "video_id=${VIDEO_ID}" \
              --data-urlencode "upload_phase=finish" \
              --data-urlencode "video_state=PUBLISHED" \
              --data-urlencode "description=${CAPTION}")
          fi
          
          echo "Reels status: $FINISH_RES"
